# One identity per workload. No tokens mounted; nothing here talks to the Kubernetes API.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: teller-web
  labels:
    app.kubernetes.io/part-of: teller
automountServiceAccountToken: false
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: ledger-api
  labels:
    app.kubernetes.io/part-of: teller
automountServiceAccountToken: false
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: teller-db
  labels:
    app.kubernetes.io/part-of: teller
automountServiceAccountToken: false
