# Teller web tier. Two replicas, like WEB01 and WEB02, except these are cattle.
apiVersion: v1
kind: Service
metadata:
  name: teller-web
  labels:
    app.kubernetes.io/name: teller-web
    app.kubernetes.io/part-of: teller
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: teller-web
  ports:
    - name: http
      port: 80
      targetPort: 8080
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: teller-web
  labels:
    app.kubernetes.io/name: teller-web
    app.kubernetes.io/part-of: teller
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: teller-web
  template:
    metadata:
      labels:
        app.kubernetes.io/name: teller-web
        app.kubernetes.io/part-of: teller
    spec:
      serviceAccountName: teller-web
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: teller-web
          image: ghcr.io/mikestizza/teller-web:main
          ports:
            - name: http
              containerPort: 8080
          envFrom:
            - configMapRef:
                name: teller-config
            - secretRef:
                name: teller-secret
          env:
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
          resources:
            requests:
              cpu: 100m
              memory: 160Mi
            limits:
              cpu: "1"
              memory: 512Mi
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
            failureThreshold: 12
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 10
            periodSeconds: 15
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
---
# TLS and host routing terminate here (Traefik). This is what the external load balancer
# VIP points at. ${INGRESS_DOMAIN} is substituted by Flux from the
# teller-cluster-vars ConfigMap, e.g. 10.38.207.150.sslip.io
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: teller-web
  labels:
    app.kubernetes.io/name: teller-web
    app.kubernetes.io/part-of: teller
spec:
  ingressClassName: ${INGRESS_CLASS:=kommander-traefik}
  # No secretName: Traefik serves its default certificate, so https works on
  # the lab. In production this is a cert-manager Certificate or the external load balancer
  # terminating TLS in front.
  tls:
    - hosts:
        - teller.${INGRESS_DOMAIN}
  rules:
    - host: teller.${INGRESS_DOMAIN}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: teller-web
                port:
                  name: http
