# Gatekeeper: images in teller-managed namespaces must be pinned. No :latest and
# no untagged images. Patching is a deliberate tag bump in Git, not a surprise.
apiVersion: templates.gatekeeper.sh/v1
kind: ConstraintTemplate
metadata:
  name: tellerdisallowlatest
spec:
  crd:
    spec:
      names:
        kind: TellerDisallowLatest
  targets:
    - target: admission.k8s.gatekeeper.sh
      rego: |
        package tellerdisallowlatest

        containers[c] {
          c := input.review.object.spec.template.spec.containers[_]
        }
        containers[c] {
          c := input.review.object.spec.containers[_]
        }

        violation[{"msg": msg}] {
          c := containers[_]
          endswith(c.image, ":latest")
          msg := sprintf("Policy: container <%v> uses image <%v>; the :latest tag is not allowed (Teller platform standard)", [c.name, c.image])
        }

        violation[{"msg": msg}] {
          c := containers[_]
          not contains(c.image, ":")
          not contains(c.image, "@")
          msg := sprintf("Policy: container <%v> uses untagged image <%v>; pin a tag or digest (Teller platform standard)", [c.name, c.image])
        }
