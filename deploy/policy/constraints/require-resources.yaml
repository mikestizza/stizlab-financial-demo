apiVersion: constraints.gatekeeper.sh/v1beta1
kind: TellerRequiredLimits
metadata:
  name: teller-containers-must-have-limits
spec:
  enforcementAction: deny
  match:
    kinds:
      - apiGroups: ["apps"]
        kinds: ["Deployment", "StatefulSet", "DaemonSet"]
      - apiGroups: [""]
        kinds: ["Pod"]
    namespaceSelector:
      matchLabels:
        stizlab.financial/managed: "true"
