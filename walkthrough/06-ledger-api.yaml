# Layer 6: the in-house API and the fence around it.
# Ledger API stands in for StizLab Financial's custom ancillary services. Reachable only inside the
# cluster, and only from teller-web pods. No more hairpinning through the load balancer.

# --- The Service: a name and an in-cluster address. ClusterIP means exactly that: nothing outside can reach it.
apiVersion: v1
kind: Service
metadata:
  name: ledger-api                                # DNS name the web app uses: http://ledger-api
  namespace: teller
  labels:
    app.kubernetes.io/name: ledger-api
    app.kubernetes.io/part-of: teller
spec:
  type: ClusterIP                                # internal virtual IP only. No NodePort, no LoadBalancer, no external address of any kind.
  selector:
    app.kubernetes.io/name: ledger-api            # load-balances across every pod with this label (both replicas)
  ports:
    - name: http
      port: 80                                   # clients call port 80...
      targetPort: 8080                           # ...which maps to 8080 inside the container (non-root processes cannot bind 80)
---
# --- The Deployment: two identical stateless replicas, replaced on every image change.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ledger-api
  namespace: teller
  labels:
    app.kubernetes.io/name: ledger-api
    app.kubernetes.io/part-of: teller
spec:
  replicas: 2                                    # two pods, scheduled on different nodes when possible
  selector:
    matchLabels:
      app.kubernetes.io/name: ledger-api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: ledger-api        # the label the Service and the NetworkPolicy match on
        app.kubernetes.io/part-of: teller
    spec:
      serviceAccountName: ledger-api              # identity from layer 4
      securityContext:
        runAsNonRoot: true                       # kubelet refuses to start the container if the image would run as root
        seccompProfile:
          type: RuntimeDefault                   # syscall filter: the container runtime's default allow-list
      containers:
        - name: ledger-api
          image: ghcr.io/mikestizza/ledger-api:main   # the image CI built. Flux will pin this to main-<sha> in layer 10
          ports:
            - name: http
              containerPort: 8080                # Kestrel listens here (ASPNETCORE_URLS in the Dockerfile)
          resources:
            requests:
              cpu: 50m                           # tiny: a minimal API idles at a few millicores
              memory: 96Mi
            limits:
              cpu: 500m
              memory: 256Mi
          readinessProbe:
            httpGet:
              path: /healthz                     # the app's own health endpoint
              port: http
            initialDelaySeconds: 3
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 10
            periodSeconds: 15
          securityContext:
            allowPrivilegeEscalation: false      # no setuid, no gaining privileges after start
            capabilities:
              drop: ["ALL"]                      # no Linux capabilities at all; a web app needs none
---
# --- The NetworkPolicy: who may talk to ledger-api. Enforced by Cilium on every node.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: ledger-api-ingress
  namespace: teller
  labels:
    app.kubernetes.io/part-of: teller
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: ledger-api          # this policy protects the ledger-api pods
  policyTypes: ["Ingress"]                       # we are restricting inbound traffic (egress is left open)
  ingress:                                       # the ONLY allowed inbound traffic is what's listed here; everything else is dropped
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: teller-web  # pods in this namespace labeled teller-web
      ports:
        - protocol: TCP
          port: 8080                             # and only on 8080
